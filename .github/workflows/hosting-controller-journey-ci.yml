name: Hosted controller journey CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  controller-journey:
    name: Authenticated controller to hosted TLS notes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 3
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.7
          cache: false

      - name: Set up pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Record hosted Docker versions
        timeout-minutes: 1
        run: |
          docker version --format 'Docker CLI={{.Client.Version}} Engine={{.Server.Version}} API={{.Server.APIVersion}}'
          docker buildx version
          docker compose version

      - name: Install application-owned fixture dependencies
        timeout-minutes: 5
        run: pnpm --dir examples/hosting-notes install --frozen-lockfile

      - name: Install browser harness dependencies
        timeout-minutes: 5
        run: pnpm --dir web install --frozen-lockfile

      - name: Install Chromium for the deployed-app journey
        timeout-minutes: 10
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Exercise controller source to deployed external TLS note
        timeout-minutes: 30
        shell: bash
        env:
          RIG_RUN_LIVE_CONTROLLER_JOURNEY: "1"
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          test_name='TestLiveControllerGeneratedDeploymentJourney'
          outage_test_name='TestLiveControllerGeneratedDeploymentJourney/ExternalDependencyOutage'
          stage_test_name='TestControllerJourneyStageSource'
          test_pattern='^Test(ControllerJourneyStageSource|LiveControllerGeneratedDeploymentJourney)$'
          package_name='github.com/hostd/hostd/cmd/hostd'
          go test -tags live_docker -json -v -count=1 -timeout=29m ./cmd/hostd -run "$test_pattern" | tee "$output"
          jq -e -s --arg package_name "$package_name" --arg test_name "$test_name" --arg outage_test_name "$outage_test_name" --arg stage_test_name "$stage_test_name" '
            ([.[] | select(.Action == "pass" and .Package == $package_name and .Test == $test_name)] | length == 1) and
            ([.[] | select(.Action == "pass" and .Package == $package_name and .Test == $outage_test_name)] | length == 1) and
            ([.[] | select(.Action == "pass" and .Package == $package_name and .Test == $stage_test_name)] | length == 1) and
            ([.[] | select((.Action == "fail" or .Action == "skip") and .Package == $package_name and (.Test == $test_name or .Test == $outage_test_name or .Test == $stage_test_name))] | length == 0)
          ' "$output" > /dev/null

      - name: Require complete Docker cleanup
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          containers="$(docker ps --all --filter label=io.rig.managed --format '{{.ID}} {{.Names}} {{.Status}}')"
          networks="$(docker network ls --filter label=io.rig.managed --format '{{.ID}} {{.Name}}')"
          images="$(docker image ls --filter label=io.rig.managed=generated-image --format '{{.ID}} {{.Repository}}:{{.Tag}}')"
          fixture_containers="$(docker ps --all --filter label=com.docker.compose.project=rig-controller-journey-test --format '{{.ID}} {{.Names}} {{.Status}}')"
          fixture_networks="$(docker network ls --filter label=com.docker.compose.project=rig-controller-journey-test --format '{{.ID}} {{.Name}}')"
          fixture_volumes="$(docker volume ls --filter label=com.docker.compose.project=rig-controller-journey-test --format '{{.Name}}')"
          builders="$(docker ps --all --quiet --filter label=rig.controller=generated-builder)"
          builder_networks="$(docker network ls --quiet --filter label=rig.controller=generated-builder)"
          if [[ -n "$containers" || -n "$networks" || -n "$images" || -n "$fixture_containers" || -n "$fixture_networks" || -n "$fixture_volumes" || -n "$builders" || -n "$builder_networks" ]] || docker volume inspect rig-generated-caddy-config-v1 >/dev/null 2>&1 || docker network inspect rig-controller-journey-external >/dev/null 2>&1; then
            printf 'Hosted controller journey resources were not cleaned up.\n' >&2
            exit 1
          fi

  controller-process-kill:
    name: Controller process kill and restart boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Check out source
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 3
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.7
          cache: false

      - name: Set up pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        timeout-minutes: 3
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Record hosted Docker versions
        timeout-minutes: 1
        run: |
          docker version --format 'Docker CLI={{.Client.Version}} Engine={{.Server.Version}} API={{.Server.APIVersion}}'
          docker buildx version
          docker compose version

      - name: Install application-owned fixture dependencies
        timeout-minutes: 5
        run: pnpm --dir examples/hosting-notes install --frozen-lockfile

      - name: Install browser harness dependencies
        timeout-minutes: 5
        run: pnpm --dir web install --frozen-lockfile

      - name: Install Chromium for the deployed-app journey
        timeout-minutes: 10
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Exercise killed controller process and retained recovery
        timeout-minutes: 50
        shell: bash
        env:
          RIG_RUN_LIVE_PROCESS_KILL: "1"
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          test_name='TestLiveControllerGeneratedProcessKillRecovery'
          package_name='github.com/hostd/hostd/cmd/hostd'
          go test -tags live_docker -json -v -count=1 -timeout=49m ./cmd/hostd -run "^${test_name}$" | tee "$output"
          jq -se --arg package_name "$package_name" --arg test_name "$test_name" '[.[] | select(.Package == $package_name and .Test == $test_name)] | ([.[] | select(.Action == "pass")] | length) == 1 and ([.[] | select(.Action == "fail" or .Action == "skip")] | length) == 0' "$output" > /dev/null
          for boundary in before_build before_candidate_start after_route_commit before_drain_stop after_runtime_success after_main_success; do
            jq -se --arg package_name "$package_name" --arg test_name "${test_name}/${boundary}" '[.[] | select(.Package == $package_name and .Test == $test_name)] | ([.[] | select(.Action == "pass")] | length) == 1 and ([.[] | select(.Action == "fail" or .Action == "skip")] | length) == 0' "$output" > /dev/null
          done

      - name: Require complete Docker cleanup
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          containers="$(docker ps --all --filter label=io.rig.managed --format '{{.ID}} {{.Names}} {{.Status}}')"
          networks="$(docker network ls --filter label=io.rig.managed --format '{{.ID}} {{.Name}}')"
          images="$(docker image ls --filter label=io.rig.managed=generated-image --format '{{.ID}} {{.Repository}}:{{.Tag}}')"
          fixture_containers="$(docker ps --all --filter label=com.docker.compose.project=rig-controller-journey-test --format '{{.ID}} {{.Names}} {{.Status}}')"
          fixture_networks="$(docker network ls --filter label=com.docker.compose.project=rig-controller-journey-test --format '{{.ID}} {{.Name}}')"
          fixture_volumes="$(docker volume ls --filter label=com.docker.compose.project=rig-controller-journey-test --format '{{.Name}}')"
          builders="$(docker ps --all --quiet --filter label=rig.controller=generated-builder)"
          builder_networks="$(docker network ls --quiet --filter label=rig.controller=generated-builder)"
          if [[ -n "$containers" || -n "$networks" || -n "$images" || -n "$fixture_containers" || -n "$fixture_networks" || -n "$fixture_volumes" || -n "$builders" || -n "$builder_networks" ]] || docker volume inspect rig-generated-caddy-config-v1 >/dev/null 2>&1 || docker network inspect rig-controller-journey-external >/dev/null 2>&1; then
            printf 'Hosted controller process-kill resources were not cleaned up.\n' >&2
            exit 1
          fi
