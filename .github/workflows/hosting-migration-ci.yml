name: Hosted migration approval and uncertainty CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  migration-journey:
    name: Approved migration and uncertain completion in Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 3
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.7
          cache: false

      - name: Record hosted Docker versions
        timeout-minutes: 1
        run: |
          docker version --format 'Docker CLI={{.Client.Version}} Engine={{.Server.Version}} API={{.Server.APIVersion}}'
          docker buildx version
          docker compose version

      - name: Exercise approved migration and uncertain completion
        timeout-minutes: 32
        shell: bash
        env:
          RIG_RUN_LIVE_MIGRATION_JOURNEY: "1"
        run: |
          set -euo pipefail
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          test_name='TestLiveGeneratedMigrationApprovalAndUncertaintyJourney'
          provider_test='TestControllerJourneyGitHubProviderRetainsImmutableRevisions'
          package_name='github.com/hostd/hostd/cmd/hostd'
          go test -tags live_docker -json -v -count=1 -timeout=31m ./cmd/hostd -run '^Test(ControllerJourneyGitHubProviderRetainsImmutableRevisions|LiveGeneratedMigrationApprovalAndUncertaintyJourney)$' | tee "$output"
          for required in "$provider_test" "$test_name"; do
            jq -e --arg package_name "$package_name" --arg test_name "$required" 'select(.Action == "pass" and .Package == $package_name and .Test == $test_name)' "$output" > /dev/null
          done

      - name: Require complete owned Docker cleanup
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          containers="$(docker ps --all --filter label=io.rig.managed --format '{{.ID}} {{.Names}} {{.Status}}')"
          networks="$(docker network ls --filter label=io.rig.managed --format '{{.ID}} {{.Name}}')"
          images="$(docker image ls --filter label=io.rig.managed=generated-image --format '{{.ID}} {{.Repository}}:{{.Tag}}')"
          fixture_containers="$(docker ps --all --filter label=com.docker.compose.project=rig-migration-journey-test --format '{{.ID}} {{.Names}} {{.Status}}')"
          fixture_networks="$(docker network ls --filter label=com.docker.compose.project=rig-migration-journey-test --format '{{.ID}} {{.Name}}')"
          fixture_volumes="$(docker volume ls --filter label=com.docker.compose.project=rig-migration-journey-test --format '{{.Name}}')"
          builders="$(docker ps --all --quiet --filter label=rig.controller=generated-builder)"
          builder_networks="$(docker network ls --quiet --filter label=rig.controller=generated-builder)"
          if [[ -n "$containers" || -n "$networks" || -n "$images" || -n "$fixture_containers" || -n "$fixture_networks" || -n "$fixture_volumes" || -n "$builders" || -n "$builder_networks" ]] || docker volume inspect rig-generated-caddy-config-v1 >/dev/null 2>&1 || docker network inspect rig-migration-journey-external >/dev/null 2>&1; then
            printf 'Hosted migration journey resources were not cleaned up.\n' >&2
            exit 1
          fi
