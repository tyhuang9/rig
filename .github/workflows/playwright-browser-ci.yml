name: Playwright browser CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  playwright-browser:
    name: Hosted Chromium verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.7
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.22.0
          run_install: false

      - name: Install frontend dependencies
        timeout-minutes: 5
        run: pnpm --dir web install --frozen-lockfile

      - name: Install Chromium
        timeout-minutes: 10
        run: pnpm --dir web exec playwright install --with-deps chromium

      - name: Run browser verification
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/playwright
          sh scripts/capture-visuals.sh 2>&1 | tee artifacts/playwright/browser-verification.log

      - name: Upload browser failure evidence
        if: failure()
        timeout-minutes: 5
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            web/test-results/
            artifacts/screenshots/
            artifacts/playwright/browser-verification.log
