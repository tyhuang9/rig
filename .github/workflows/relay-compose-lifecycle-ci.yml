name: Relay Compose lifecycle CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay-compose-lifecycle:
    name: Relay Compose lifecycle verification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run deterministic relay packaging checks
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/check-relay-packaging.ps1 -SelfTest
          pwsh -NoProfile -File scripts/check-relay-packaging.ps1 -BehaviorTest

      - name: Exercise the production relay Compose baseline
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          sudo env CI=true GITHUB_ACTIONS=true \
            bash scripts/check-relay-compose-lifecycle.sh run \
            "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Remove relay lifecycle fixtures
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          sudo bash scripts/check-relay-compose-lifecycle.sh cleanup \
            "${{ github.run_id }}-${{ github.run_attempt }}"
