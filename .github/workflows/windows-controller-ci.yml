name: Windows controller CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  windows-controller:
    name: Windows controller verification
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.7
          cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run full Go tests
        run: go test -count=1 -timeout=20m ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Build controller commands
        run: go build -trimpath ./cmd/hostd ./cmd/hostctl ./cmd/rig-relay ./cmd/rig-relay-probe

      - name: Prove Windows controller protections execute
        run: pwsh -NoProfile -File scripts/check-windows-controller.ps1

      - name: Type-check frontend
        run: pnpm --dir web typecheck

      - name: Test frontend
        run: pnpm --dir web test

      - name: Check generated contracts and migrations
        run: pwsh -NoProfile -File scripts/check-generation.ps1

      - name: Check embedded dashboard assets
        run: pwsh -NoProfile -File scripts/check-embedded.ps1
