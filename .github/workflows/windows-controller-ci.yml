name: Windows controller CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  windows-controller-core:
    name: Windows controller core checks
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.7
          cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run repository tests outside the Windows ingress partitions
        run: |
          $ErrorActionPreference = 'Stop'
          $allPackages = @(& go list ./...)
          if ($LASTEXITCODE -ne 0) { throw 'Go package discovery failed.' }
          $ingress = @($allPackages | Where-Object { $_ -eq 'github.com/hostd/hostd/internal/generatedingress' })
          $packages = @($allPackages | Where-Object { $_ -ne 'github.com/hostd/hostd/internal/generatedingress' })
          if ($ingress.Count -ne 1 -or $packages.Count -eq 0) { throw 'Incomplete Go package inventory.' }
          & go test -count=1 -timeout=20m @packages
          if ($LASTEXITCODE -ne 0) { throw 'Repository Go tests failed.' }

      - name: Run Go vet
        run: go vet ./...

      - name: Build controller commands
        run: go build -trimpath ./cmd/hostd ./cmd/hostctl ./cmd/rig-relay ./cmd/rig-relay-probe

      - name: Prove Windows controller protections execute
        run: pwsh -NoProfile -File scripts/check-windows-controller.ps1

      - name: Type-check frontend
        run: pnpm --dir web typecheck

      - name: Test frontend
        run: pnpm --dir web test

      - name: Check generated contracts and migrations
        run: pwsh -NoProfile -File scripts/check-generation.ps1

      - name: Check embedded dashboard assets
        run: pwsh -NoProfile -File scripts/check-embedded.ps1

  windows-ingress:
    name: Windows ingress tests (${{ matrix.suite }})
    runs-on: windows-2025
    timeout-minutes: 42
    strategy:
      fail-fast: false
      matrix:
        suite:
          - gateway-v2
          - rebind-history
          - rebind-current
          - rebind-config
          - rebind-resources
          - rebind-handover
          - rebind-handover-rollback
          - rebind-typed-withdrawal
          - rebind-typed-completed
          - rebind-typed-runtime
          - rebind-composition-native
          - rebind-composition-second-generation
          - rebind-composition-legacy-source
          - current-lan
          - current-lan-recovery
          - current-runtime
          - current-serving
          - ingress-remainder
    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out source
        timeout-minutes: 2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        timeout-minutes: 3
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: 1.26.7
          cache: false

      - name: Verify Windows shared-runner prerequisites
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          bash --version
          jq --version
          test "$(go env GOOS)" = windows

      - name: Run complete Windows ingress partition
        timeout-minutes: 34
        shell: bash
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: bash scripts/check-generated-runtime-race.sh "$TEST_SUITE" plain

  windows-controller:
    name: Windows controller verification
    if: ${{ always() }}
    needs: [windows-controller-core, windows-ingress]
    runs-on: windows-2025
    timeout-minutes: 2
    steps:
      - name: Require core checks and every Windows ingress partition
        shell: pwsh
        env:
          CORE_RESULT: ${{ needs.windows-controller-core.result }}
          INGRESS_RESULT: ${{ needs.windows-ingress.result }}
        run: |
          if ($env:CORE_RESULT -ne 'success' -or $env:INGRESS_RESULT -ne 'success') {
            throw 'Windows controller verification did not pass every required group.'
          }
