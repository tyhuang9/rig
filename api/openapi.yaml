openapi: 3.1.0
info:
  title: hostd Phase A API
  version: 0.1.0
  description: Authenticated local-only control plane. Runtime actions require the explicit fake-runtime development capability and never execute workloads.
servers:
  - url: http://127.0.0.1:7345
security:
  - sessionCookie: []
x-job-responses: &jobResponses
  '200': {description: Existing idempotent job, content: {application/json: {schema: {$ref: '#/components/schemas/JobMutationResponse'}}}}
  '202': {description: Job accepted, content: {application/json: {schema: {$ref: '#/components/schemas/JobMutationResponse'}}}}
  default: {$ref: '#/components/responses/Problem'}
paths:
  /api/v1/auth/bootstrap/status:
    get:
      operationId: bootstrapStatus
      security: []
      responses:
        '200': {description: Bootstrap state, content: {application/json: {schema: {$ref: '#/components/schemas/BootstrapStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrap
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BootstrapRequest'}}}}
      responses:
        '201': {description: Administrator and session created, headers: {Set-Cookie: {$ref: '#/components/headers/SessionCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}}
        '429': {description: Authentication work is temporarily rate limited, headers: {Retry-After: {description: Seconds until another authentication attempt may be made, schema: {type: integer, minimum: 1}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/sessions:
    post:
      operationId: login
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '201': {description: Session created, headers: {Set-Cookie: {$ref: '#/components/headers/SessionCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}}
        '429': {description: Authentication work is temporarily rate limited, headers: {Retry-After: {description: Seconds until another authentication attempt may be made, schema: {type: integer, minimum: 1}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/sessions/current:
    delete:
      operationId: logout
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '204': {description: Session revoked and cookie cleared}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/me:
    get:
      operationId: me
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/MeResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/csrf:
    get:
      operationId: rotateCSRF
      description: Rotates the CSRF secret for an authenticated session-cookie restore. Only the new plaintext value is returned; only its hash is stored.
      responses:
        '200': {description: Rotated CSRF token, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/system/status:
    get:
      operationId: systemStatus
      responses:
        '200': {description: Controller status and capabilities, content: {application/json: {schema: {$ref: '#/components/schemas/SystemStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/system/doctor:
    get:
      operationId: doctor
      responses:
        '200': {description: Independent local diagnostics, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps:
    get:
      operationId: listApplications
      responses:
        '200': {description: Applications, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createApplication
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateApplicationRequest'}}}}
      responses:
        '201': {description: Application created, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/import/inspect:
    post:
      operationId: inspectImport
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InspectRequest'}}}}
      responses:
        '200': {description: Phase A inspection boundary, content: {application/json: {schema: {$ref: '#/components/schemas/InspectResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    get:
      operationId: getApplication
      responses:
        '200': {description: Application, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/services:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    get:
      operationId: listServices
      responses:
        '200': {description: Application services, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/deployments:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: deployApplication
      security: [{sessionCookie: [], csrfHeader: []}]
      responses: *jobResponses
  /api/v1/apps/{appId}/start:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: startApplication
      security: [{sessionCookie: [], csrfHeader: []}]
      responses: *jobResponses
  /api/v1/apps/{appId}/stop:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: stopApplication
      security: [{sessionCookie: [], csrfHeader: []}]
      responses: *jobResponses
  /api/v1/apps/{appId}/restart:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: restartApplication
      security: [{sessionCookie: [], csrfHeader: []}]
      responses: *jobResponses
  /api/v1/apps/{appId}/logs/stream:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/LastEventId'}]
    get:
      operationId: streamLogs
      responses:
        '200': {description: SSE log boundary stream, content: {text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs:
    get:
      operationId: listJobs
      responses:
        '200': {description: Durable jobs, content: {application/json: {schema: {$ref: '#/components/schemas/JobList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      operationId: getJob
      responses:
        '200': {description: Job, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}/events:
    parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/AfterEventId'}]
    get:
      operationId: listJobEvents
      responses:
        '200': {description: Ordered durable job events, content: {application/json: {schema: {$ref: '#/components/schemas/JobEventList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}/cancel:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      operationId: cancelJob
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {description: Job cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}/events/stream:
    parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/AfterEventId'}, {$ref: '#/components/parameters/LastEventId'}]
    get:
      operationId: streamJobEvents
      responses:
        '200': {description: Replayable SSE job-event stream, content: {text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/machines:
    get:
      operationId: listMachines
      responses:
        '200': {description: Registered machines, content: {application/json: {schema: {$ref: '#/components/schemas/MachineList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections:
    get:
      operationId: listSourceConnections
      responses:
        '200': {description: Source connections owned by the authenticated user, content: {application/json: {schema: {$ref: '#/components/schemas/SourceConnectionList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/github/device:
    post:
      operationId: startGitHubDeviceConnection
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '201': {description: GitHub device authorization started, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/GitHubDeviceAuthorization'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    delete:
      operationId: disconnectSourceConnection
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '204': {description: Local connection credentials and cached metadata destroyed}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}/device/poll:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    post:
      operationId: pollGitHubDeviceConnection
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {description: GitHub connection established, content: {application/json: {schema: {$ref: '#/components/schemas/SourceConnection'}}}}
        '202': {description: GitHub authorization remains pending, headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/json: {schema: {$ref: '#/components/schemas/SourceConnection'}}}}
        '429': {description: Poll attempted before the persisted next-poll time, headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}/refresh:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    post:
      operationId: refreshSourceConnection
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {description: Source credentials refreshed, content: {application/json: {schema: {$ref: '#/components/schemas/SourceConnection'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}/github/installations:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}]
    get:
      operationId: listGitHubInstallations
      description: Fetches a live provider page and updates only that page's display cache. Cached rows never authorize source access.
      responses:
        '200': {description: Live GitHub App installations, content: {application/json: {schema: {$ref: '#/components/schemas/GitHubInstallationPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}/github/installations/{installationId}/repositories:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}, {$ref: '#/components/parameters/InstallationId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}]
    get:
      operationId: listGitHubRepositories
      description: Lists repositories currently accessible through the authenticated user's selected GitHub App installation.
      responses:
        '200': {description: Live accessible repositories, content: {application/json: {schema: {$ref: '#/components/schemas/GitHubRepositoryPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}/github/installations/{installationId}/repositories/{repositoryId}/branches:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}, {$ref: '#/components/parameters/InstallationId'}, {$ref: '#/components/parameters/RepositoryId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}]
    get:
      operationId: listGitHubBranches
      description: Revalidates the immutable repository ID within the selected installation before listing branches.
      responses:
        '200': {description: Live repository branches, content: {application/json: {schema: {$ref: '#/components/schemas/GitHubBranchPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hostd_session
      description: Opaque random session token. Set HttpOnly, Path=/, SameSite=Strict; Secure is enabled when served over TLS. Only a SHA-256 hash is stored.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required with sessionCookie for every non-safe request. Rotated by the authenticated CSRF endpoint; only its hash is stored.
  headers:
    SessionCookie:
      description: HttpOnly hostd_session cookie with Path=/ and SameSite=Strict; Secure when TLS is configured.
      schema: {type: string}
  parameters:
    AppId: {name: appId, in: path, required: true, schema: {type: string, format: uuid}}
    JobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 200}}
    AfterEventId: {name: after, in: query, required: false, schema: {type: integer, format: int64, minimum: 0}}
    LastEventId: {name: Last-Event-ID, in: header, required: false, schema: {type: integer, format: int64, minimum: 0}}
    ConnectionId: {name: connectionId, in: path, required: true, schema: {type: string, pattern: '^[a-f0-9]{32}$'}}
    InstallationId: {name: installationId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    RepositoryId: {name: repositoryId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    Page: {name: page, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
    PerPage: {name: perPage, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
  responses:
    Problem:
      description: RFC 9457 problem response
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code, requestId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
        requestId: {type: string}
        errors: {type: object, additionalProperties: {type: string}}
    BootstrapStatus: {type: object, required: [bootstrapRequired], properties: {bootstrapRequired: {type: boolean}}}
    BootstrapRequest: {type: object, additionalProperties: false, required: [token, username, passphrase], properties: {token: {type: string, minLength: 1, maxLength: 256}, username: {type: string, minLength: 1, maxLength: 128}, passphrase: {type: string, minLength: 12, maxLength: 1024}}}
    LoginRequest: {type: object, additionalProperties: false, required: [username, passphrase], properties: {username: {type: string, minLength: 1, maxLength: 128}, passphrase: {type: string, minLength: 1, maxLength: 1024}}}
    User: {type: object, required: [id, username, role], properties: {id: {type: string, format: uuid}, username: {type: string}, role: {type: string, const: administrator}}}
    SessionResponse: {type: object, required: [user, csrfToken], properties: {user: {$ref: '#/components/schemas/User'}, csrfToken: {type: string}}}
    MeResponse: {type: object, required: [user], properties: {user: {$ref: '#/components/schemas/User'}}}
    CSRFResponse: {type: object, required: [csrfToken], properties: {csrfToken: {type: string}}}
    Capabilities: {type: object, required: [fakeRuntime, githubConnections], properties: {fakeRuntime: {type: boolean}, githubConnections: {type: boolean}}}
    Diagnostics:
      type: object
      required: [daemonRunning, clientAvailable, engineReady, composeAvailable, caddyManaged, os, architecture, dockerVersion, composeVersion, dockerDetail, composeDetail, startupLimitation, resources]
      properties: {daemonRunning: {type: boolean}, clientAvailable: {type: boolean}, engineReady: {type: boolean}, composeAvailable: {type: boolean}, caddyManaged: {type: boolean}, os: {type: string}, architecture: {type: string}, dockerVersion: {type: string}, composeVersion: {type: string}, dockerDetail: {type: string}, composeDetail: {type: string}, startupLimitation: {type: string}, resources: {$ref: '#/components/schemas/HostResources'}}
    HostResources: {type: object, required: [memoryTotalBytes, memoryAvailableBytes, diskTotalBytes, diskAvailableBytes], properties: {memoryTotalBytes: {type: integer, format: int64}, memoryAvailableBytes: {type: integer, format: int64}, diskTotalBytes: {type: integer, format: int64}, diskAvailableBytes: {type: integer, format: int64}}}
    SystemStatus: {type: object, required: [daemon, diagnostics, capabilities], properties: {daemon: {type: string, const: running}, diagnostics: {$ref: '#/components/schemas/Diagnostics'}, capabilities: {$ref: '#/components/schemas/Capabilities'}}}
    DoctorCheck: {type: object, required: [name, ok, detail], properties: {name: {type: string}, ok: {type: boolean}, detail: {type: string}}}
    DoctorResponse: {type: object, required: [checks, startupLimitation], properties: {checks: {type: array, items: {$ref: '#/components/schemas/DoctorCheck'}}, startupLimitation: {type: string}}}
    Application: {type: object, required: [id, slug, name, description, status, machineName, createdAt, source], properties: {id: {type: string, format: uuid}, slug: {type: string}, name: {type: string}, description: {type: string}, status: {type: string}, machineName: {type: string}, createdAt: {type: string, format: date-time}, source: {$ref: '#/components/schemas/SourceSummary'}}}
    ApplicationList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Application'}}}}
    GitHubSource: {type: object, additionalProperties: false, required: [connectionId, installationId, repositoryId, branch], properties: {connectionId: {type: string, pattern: '^[a-f0-9]{32}$'}, installationId: {type: integer, format: int64, minimum: 1}, repositoryId: {type: integer, format: int64, minimum: 1}, branch: {type: string, minLength: 1, maxLength: 255}, composePath: {type: string, minLength: 1, maxLength: 1024}}}
    SourceSummary: {type: object, required: [type], properties: {type: {type: string, enum: [local, github]}, path: {type: string}, connectionId: {type: string}, installationId: {type: integer, format: int64}, repositoryId: {type: integer, format: int64}, repositoryOwner: {type: string}, repositoryName: {type: string}, trackedBranch: {type: string}, trackedRef: {type: string}, composePath: {type: string}, resolvedSha: {type: string}}}
    CreateApplicationRequest: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string}, description: {type: string}, sourcePath: {type: string}, githubSource: {$ref: '#/components/schemas/GitHubSource'}, machineId: {type: string, format: uuid}}}
    InspectRequest: {type: object, additionalProperties: false, properties: {sourcePath: {type: string}, githubSource: {$ref: '#/components/schemas/GitHubSource'}}}
    SourceFinding: {type: object, required: [code, message], properties: {code: {type: string}, message: {type: string}, path: {type: string}}}
    DetectedService: {type: object, required: [name], properties: {name: {type: string}, image: {type: string}, buildContext: {type: string}}}
    InspectResponse: {type: object, required: [source, composeCandidates, services, findings], properties: {source: {$ref: '#/components/schemas/SourceSummary'}, resolvedSha: {type: string}, composeCandidates: {type: array, items: {type: string}}, services: {type: array, items: {$ref: '#/components/schemas/DetectedService'}}, findings: {type: array, items: {$ref: '#/components/schemas/SourceFinding'}}}}
    Service: {type: object, required: [id, name, kind, status], properties: {id: {type: string, format: uuid}, name: {type: string}, kind: {type: string}, status: {type: string}, port: {type: integer}}}
    ServiceList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Service'}}}}
    Job: {type: object, required: [id, type, resourceType, resourceId, status, phase, checkpoint, progress, createdAt, updatedAt], properties: {id: {type: string, format: uuid}, type: {type: string}, resourceType: {type: string}, resourceId: {type: string}, status: {type: string}, phase: {type: string}, checkpoint: {type: string}, errorCode: {type: string}, errorDetail: {type: string}, progress: {type: integer}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    JobMutationResponse: {type: object, required: [job, created], properties: {job: {$ref: '#/components/schemas/Job'}, created: {type: boolean}}}
    JobResponse: {type: object, required: [job], properties: {job: {$ref: '#/components/schemas/Job'}}}
    JobList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Job'}}}}
    JobEvent: {type: object, required: [id, jobId, sequence, timestamp, level, phase, code, message], properties: {id: {type: integer, format: int64}, jobId: {type: string, format: uuid}, sequence: {type: integer}, timestamp: {type: string, format: date-time}, level: {type: string}, phase: {type: string}, code: {type: string}, message: {type: string}}}
    JobEventList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/JobEvent'}}}}
    Machine: {type: object, required: [id, name, status, os, architecture, hostname, dockerVersion, composeVersion, resources], properties: {id: {type: string, format: uuid}, name: {type: string}, status: {type: string}, os: {type: string}, architecture: {type: string}, hostname: {type: string}, dockerVersion: {type: string}, composeVersion: {type: string}, resources: {type: object, additionalProperties: true}}}
    MachineList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Machine'}}}}
    SourceConnection: {type: object, required: [id, provider, status, credentialGeneration, createdAt, updatedAt], properties: {id: {type: string, pattern: '^[a-f0-9]{32}$'}, provider: {type: string, const: github}, status: {type: string, enum: [pending, connected, denied, expired, disconnected, access_lost]}, providerUserId: {type: string, minLength: 1, maxLength: 128}, providerLogin: {type: string, minLength: 1, maxLength: 255}, credentialGeneration: {type: integer, format: int64, minimum: 0}, pendingExpiresAt: {type: string, format: date-time}, nextPollAt: {type: string, format: date-time}, accessExpiresAt: {type: string, format: date-time}, refreshExpiresAt: {type: string, format: date-time}, lastErrorCode: {type: string, minLength: 1, maxLength: 64}, connectedAt: {type: string, format: date-time}, disconnectedAt: {type: string, format: date-time}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}}}
    SourceConnectionList: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/SourceConnection'}}}}
    GitHubDeviceAuthorization: {type: object, required: [connectionId, userCode, verificationUri, installUrl, expiresAt, pollIntervalSeconds], properties: {connectionId: {type: string, pattern: '^[a-f0-9]{32}$'}, userCode: {type: string, minLength: 1, maxLength: 64}, verificationUri: {type: string, const: 'https://github.com/login/device'}, installUrl: {type: string, format: uri}, expiresAt: {type: string, format: date-time}, pollIntervalSeconds: {type: integer, minimum: 1, maximum: 300}}}
    GitHubInstallation: {type: object, required: [id, accountLogin, accountType, targetType, repositorySelection, cachedAt], properties: {id: {type: integer, format: int64, minimum: 1}, accountLogin: {type: string, minLength: 1, maxLength: 255}, accountType: {type: string, enum: [User, Organization, Enterprise, Bot]}, targetType: {type: string, enum: [User, Organization]}, repositorySelection: {type: string, enum: [all, selected]}, suspendedAt: {type: string, format: date-time}, cachedAt: {type: string, format: date-time}}}
    GitHubInstallationPage: {type: object, required: [page, perPage, totalCount, items], properties: {page: {type: integer, minimum: 1, maximum: 10000}, perPage: {type: integer, minimum: 1, maximum: 100}, totalCount: {type: integer, minimum: 0}, items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/GitHubInstallation'}}}}
    GitHubRepository: {type: object, required: [id, owner, name, defaultBranch, private, archived, disabled], properties: {id: {type: integer, format: int64, minimum: 1}, owner: {type: string}, name: {type: string}, defaultBranch: {type: string}, private: {type: boolean}, archived: {type: boolean}, disabled: {type: boolean}}}
    GitHubRepositoryPage: {type: object, required: [page, perPage, totalCount, items], properties: {page: {type: integer}, perPage: {type: integer}, totalCount: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/GitHubRepository'}}}}
    GitHubBranch: {type: object, required: [name, sha, protected], properties: {name: {type: string}, sha: {type: string}, protected: {type: boolean}}}
    GitHubBranchPage: {type: object, required: [page, perPage, items], properties: {page: {type: integer}, perPage: {type: integer}, items: {type: array, items: {$ref: '#/components/schemas/GitHubBranch'}}}}
