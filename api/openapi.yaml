openapi: 3.1.0
info:
  title: hostd Phase A API
  version: 0.1.0
  description: Authenticated local-only control plane. Workload execution is disabled by default and requires an explicit runtime capability.
servers:
  - url: http://127.0.0.1:7345
security:
  - sessionCookie: []
x-rig-problem-codes:
  authentication_required: {description: GitHub authorization does not permit the requested operation, statuses: [403]}
  source_access_lost: {description: Access to the selected GitHub source must be restored, statuses: [409]}
  provider_unavailable: {description: GitHub or its configured integration is temporarily unavailable, statuses: [503]}
  invalid_source: {description: The selected GitHub source is invalid or cannot be used, statuses: [400, 422]}
  approval_required: {description: Deployment requires an administrator approval before it can continue, statuses: [409]}
  migration_approval_required: {description: Deployment migration requires approval before it can continue, statuses: [409]}
  application_busy: {description: The application already has an active conflicting operation, statuses: [409]}
  source_too_large: {description: The source exceeds the supported inspection limits, statuses: [413]}
  deployment_plan_conflict: {description: The accepted deployment plan changed while this request was being reviewed, statuses: [409]}
  deployment_plan_review_required: {description: The source structure or inferred deployment behavior changed and must be reviewed again, statuses: [409]}
  deployment_plan_not_found: {description: No accepted deployment plan exists for the application, statuses: [404]}
  invalid_deployment_plan: {description: One or more deployment plan fields are invalid, statuses: [422]}
  migration_approval_conflict: {description: The migration approval changed while this request was being reviewed, statuses: [409]}
  relay_unavailable: {description: The configured controller relay is unavailable, statuses: [503]}
x-job-responses: &jobResponses
  '200': {description: Existing idempotent job, content: {application/json: {schema: {$ref: '#/components/schemas/JobMutationResponse'}}}}
  '202': {description: Job accepted, content: {application/json: {schema: {$ref: '#/components/schemas/JobMutationResponse'}}}}
  default: {$ref: '#/components/responses/Problem'}
paths:
  /api/v1/auth/bootstrap/status:
    get:
      operationId: bootstrapStatus
      security: []
      responses:
        '200': {description: Bootstrap state, content: {application/json: {schema: {$ref: '#/components/schemas/BootstrapStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/bootstrap:
    post:
      operationId: bootstrap
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BootstrapRequest'}}}}
      responses:
        '201': {description: Administrator and session created, headers: {Set-Cookie: {$ref: '#/components/headers/SessionCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}}
        '429': {description: Authentication work is temporarily rate limited, headers: {Retry-After: {description: Seconds until another authentication attempt may be made, schema: {type: integer, minimum: 1}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/sessions:
    post:
      operationId: login
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LoginRequest'}}}}
      responses:
        '201': {description: Session created, headers: {Set-Cookie: {$ref: '#/components/headers/SessionCookie'}}, content: {application/json: {schema: {$ref: '#/components/schemas/SessionResponse'}}}}
        '429': {description: Authentication work is temporarily rate limited, headers: {Retry-After: {description: Seconds until another authentication attempt may be made, schema: {type: integer, minimum: 1}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/sessions/current:
    delete:
      operationId: logout
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '204': {description: Session revoked and cookie cleared}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/me:
    get:
      operationId: me
      responses:
        '200': {description: Current user, content: {application/json: {schema: {$ref: '#/components/schemas/MeResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/auth/csrf:
    get:
      operationId: rotateCSRF
      description: Rotates the CSRF secret for an authenticated session-cookie restore. Only the new plaintext value is returned; only its hash is stored.
      responses:
        '200': {description: Rotated CSRF token, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/CSRFResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/system/status:
    get:
      operationId: systemStatus
      responses:
        '200': {description: Controller status and capabilities, content: {application/json: {schema: {$ref: '#/components/schemas/SystemStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/system/doctor:
    get:
      operationId: doctor
      responses:
        '200': {description: Independent local diagnostics, content: {application/json: {schema: {$ref: '#/components/schemas/DoctorResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps:
    get:
      operationId: listApplications
      responses:
        '200': {description: Applications, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createApplication
      x-rig-problem-codes: [authentication_required, source_access_lost, provider_unavailable, invalid_source, source_too_large]
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateApplicationRequest'}}}}
      responses:
        '201': {description: Application created, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/import/inspect:
    post:
      operationId: inspectImport
      x-rig-problem-codes: [authentication_required, source_access_lost, provider_unavailable, invalid_source, source_too_large]
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InspectRequest'}}}}
      responses:
        '200': {description: Phase A inspection boundary, content: {application/json: {schema: {$ref: '#/components/schemas/InspectResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    get:
      operationId: getApplication
      responses:
        '200': {description: Application, content: {application/json: {schema: {$ref: '#/components/schemas/Application'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/deployment-plan:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    get:
      operationId: getApplicationDeploymentPlan
      x-rig-problem-codes: [deployment_plan_not_found]
      responses:
        '200': {description: Current accepted deployment plan, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentPlanRevision'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: acceptApplicationDeploymentPlan
      x-rig-problem-codes: [authentication_required, source_access_lost, provider_unavailable, invalid_source, source_too_large, deployment_plan_conflict, deployment_plan_review_required, invalid_deployment_plan]
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AcceptDeploymentPlanRequest'}}}}
      responses:
        '200': {description: Accepted immutable deployment plan revision, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentPlanRevision'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/deployment-plan/migration-approval:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    post:
      operationId: approveApplicationDeploymentPlanMigration
      x-rig-problem-codes: [deployment_plan_not_found, deployment_plan_conflict, migration_approval_conflict, invalid_deployment_plan]
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApproveDeploymentPlanMigrationRequest'}}}}
      responses:
        '200': {description: Migration approval recorded, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentPlanRevision'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/services:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    get:
      operationId: listServices
      responses:
        '200': {description: Application services, content: {application/json: {schema: {$ref: '#/components/schemas/ServiceList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/deployments:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    get:
      operationId: listDeployments
      responses:
        '200': {description: Deployment history, content: {application/json: {schema: {$ref: '#/components/schemas/DeploymentList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: deployApplication
      x-rig-problem-codes: [application_busy]
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses: *jobResponses
  /api/v1/apps/{appId}/releases:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    get:
      operationId: listReleases
      responses:
        '200': {description: Release history, content: {application/json: {schema: {$ref: '#/components/schemas/ReleaseList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/releases/{releaseId}/deployments:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/ReleaseId'}]
    post:
      operationId: deployRelease
      x-rig-problem-codes: [application_busy]
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DeployReleaseRequest'}}}}
      responses: *jobResponses
  /api/v1/apps/{appId}/runtime-approvals:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    get:
      operationId: listRuntimeApprovals
      responses:
        '200': {description: Runtime approval history, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeApprovalList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: grantRuntimeApproval
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GrantRuntimeApprovalRequest'}}}}
      responses:
        '200': {description: Existing active approval, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeApprovalMutationResponse'}}}}
        '201': {description: Runtime approval granted, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeApprovalMutationResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/runtime-approvals/{approvalId}:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/ApprovalId'}]
    delete:
      operationId: revokeRuntimeApproval
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {description: Runtime approval revoked, content: {application/json: {schema: {$ref: '#/components/schemas/RuntimeApprovalResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/start:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: startApplication
      x-rig-problem-codes: [application_busy]
      security: [{sessionCookie: [], csrfHeader: []}]
      responses: *jobResponses
  /api/v1/apps/{appId}/stop:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: stopApplication
      x-rig-problem-codes: [application_busy]
      security: [{sessionCookie: [], csrfHeader: []}]
      responses: *jobResponses
  /api/v1/apps/{appId}/restart:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
    post:
      operationId: restartApplication
      x-rig-problem-codes: [application_busy]
      security: [{sessionCookie: [], csrfHeader: []}]
      responses: *jobResponses
  /api/v1/apps/{appId}/logs/stream:
    parameters: [{$ref: '#/components/parameters/AppId'}, {$ref: '#/components/parameters/LastEventId'}]
    get:
      operationId: streamLogs
      responses:
        '200': {description: SSE log boundary stream, content: {text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs:
    get:
      operationId: listJobs
      responses:
        '200': {description: Durable jobs, content: {application/json: {schema: {$ref: '#/components/schemas/JobList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    get:
      operationId: getJob
      responses:
        '200': {description: Job, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}/events:
    parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/AfterEventId'}]
    get:
      operationId: listJobEvents
      responses:
        '200': {description: Ordered durable job events, content: {application/json: {schema: {$ref: '#/components/schemas/JobEventList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}/cancel:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      operationId: cancelJob
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {description: Job cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}/resume:
    parameters: [{$ref: '#/components/parameters/JobId'}]
    post:
      operationId: resumeJob
      x-rig-problem-codes: [approval_required, migration_approval_required]
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {description: Paused job atomically requeued, content: {application/json: {schema: {$ref: '#/components/schemas/JobResponse'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/jobs/{jobId}/events/stream:
    parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/AfterEventId'}, {$ref: '#/components/parameters/LastEventId'}]
    get:
      operationId: streamJobEvents
      responses:
        '200': {description: Replayable SSE job-event stream, content: {text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/machines:
    get:
      operationId: listMachines
      responses:
        '200': {description: Registered machines, content: {application/json: {schema: {$ref: '#/components/schemas/MachineList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/configuration:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    get:
      operationId: getApplicationConfiguration
      responses:
        '200': {description: Current application configuration metadata and visible variables. Secret values are omitted., headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationConfiguration'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: replaceApplicationConfiguration
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReplaceApplicationConfigurationRequest'}}}}
      responses:
        '200': {description: New immutable configuration revision, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationConfiguration'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections:
    get:
      operationId: listSourceConnections
      responses:
        '200': {description: Source connections owned by the authenticated user, content: {application/json: {schema: {$ref: '#/components/schemas/SourceConnectionList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/github/device:
    post:
      operationId: startGitHubDeviceConnection
      x-rig-problem-codes: [authentication_required, provider_unavailable]
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '201': {description: GitHub device authorization started, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/GitHubDeviceAuthorization'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    delete:
      operationId: disconnectSourceConnection
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '204': {description: Local connection credentials and cached metadata destroyed}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}/device/poll:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    post:
      operationId: pollGitHubDeviceConnection
      x-rig-problem-codes: [authentication_required, source_access_lost, provider_unavailable]
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {description: GitHub connection established, content: {application/json: {schema: {$ref: '#/components/schemas/SourceConnection'}}}}
        '202': {description: GitHub authorization remains pending, headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/json: {schema: {$ref: '#/components/schemas/SourceConnection'}}}}
        '429': {description: Poll attempted before the persisted next-poll time, headers: {Retry-After: {schema: {type: integer, minimum: 1}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}/refresh:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}]
    post:
      operationId: refreshSourceConnection
      x-rig-problem-codes: [authentication_required, source_access_lost, provider_unavailable]
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {description: Source credentials refreshed, content: {application/json: {schema: {$ref: '#/components/schemas/SourceConnection'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}/github/installations:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}]
    get:
      operationId: listGitHubInstallations
      x-rig-problem-codes: [authentication_required, source_access_lost, provider_unavailable]
      description: Fetches a live provider page and updates only that page's display cache. Cached rows never authorize source access.
      responses:
        '200': {description: Live GitHub App installations, content: {application/json: {schema: {$ref: '#/components/schemas/GitHubInstallationPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}/github/installations/{installationId}/repositories:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}, {$ref: '#/components/parameters/InstallationId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}]
    get:
      operationId: listGitHubRepositories
      x-rig-problem-codes: [source_access_lost, provider_unavailable, invalid_source, source_too_large]
      description: Lists repositories currently accessible through the authenticated user's selected GitHub App installation.
      responses:
        '200': {description: Live accessible repositories, content: {application/json: {schema: {$ref: '#/components/schemas/GitHubRepositoryPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/source-connections/{connectionId}/github/installations/{installationId}/repositories/{repositoryId}/branches:
    parameters: [{$ref: '#/components/parameters/ConnectionId'}, {$ref: '#/components/parameters/InstallationId'}, {$ref: '#/components/parameters/RepositoryId'}, {$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PerPage'}]
    get:
      operationId: listGitHubBranches
      x-rig-problem-codes: [source_access_lost, provider_unavailable, invalid_source, source_too_large]
      description: Revalidates the immutable repository ID within the selected installation before listing branches.
      responses:
        '200': {description: Live repository branches, content: {application/json: {schema: {$ref: '#/components/schemas/GitHubBranchPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/relay/status:
    get:
      operationId: getRelayStatus
      x-rig-problem-codes: [relay_unavailable]
      responses:
        '200': {description: Relay availability, safe operator diagnostics, and owner-scoped durable management state, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/RelayStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/relay/enrollments:
    post:
      operationId: startRelayEnrollment
      x-rig-problem-codes: [authentication_required, source_access_lost, provider_unavailable, invalid_source, relay_unavailable]
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StartRelayEnrollmentRequest'}}}}
      responses:
        '201': {description: Relay enrollment started, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/RelayEnrollmentStart'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/relay/enrollments/{enrollmentId}/poll:
    parameters: [{$ref: '#/components/parameters/EnrollmentId'}]
    post:
      operationId: pollRelayEnrollment
      x-rig-problem-codes: [relay_unavailable]
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {description: Relay enrollment reached a terminal state, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/RelayEnrollmentStatus'}}}}
        '202': {description: Relay enrollment remains pending, headers: {Cache-Control: {schema: {type: string, const: no-store}}}, content: {application/json: {schema: {$ref: '#/components/schemas/RelayEnrollmentStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/relay/bindings/{bindingId}:
    parameters: [{$ref: '#/components/parameters/BindingId'}]
    delete:
      operationId: removeRelayBinding
      x-rig-problem-codes: [relay_unavailable]
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {description: Relay binding removed, content: {application/json: {schema: {$ref: '#/components/schemas/RelayBindingStatus'}}}}
        '202': {description: Relay binding removal is pending, content: {application/json: {schema: {$ref: '#/components/schemas/RelayBindingStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/relay/key-rotations:
    post:
      operationId: startRelayKeyRotation
      x-rig-problem-codes: [relay_unavailable]
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '202': {description: Relay key rotation started, content: {application/json: {schema: {$ref: '#/components/schemas/RelayKeyRotationStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/auto-deploy:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    get:
      operationId: getApplicationAutoDeploy
      responses:
        '200': {description: Application auto-deploy status, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationAutoDeployStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      operationId: updateApplicationAutoDeploy
      x-rig-problem-codes: [source_access_lost, application_busy]
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/UpdateApplicationAutoDeployRequest'}}}}
      responses:
        '200': {description: Application auto-deploy status updated, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationAutoDeployStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/apps/{appId}/auto-deploy/resume:
    parameters: [{$ref: '#/components/parameters/AppId'}]
    post:
      operationId: resumeApplicationAutoDeploy
      x-rig-problem-codes: [source_access_lost]
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ResumeApplicationAutoDeployRequest'}}}}
      responses:
        '200': {description: Application auto-deploy resumed, content: {application/json: {schema: {$ref: '#/components/schemas/ApplicationAutoDeployStatus'}}}}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
